# Qwen3-14B: grouped-query attention, one GPU per engine. YaRN extends its 32,768
# native positions to max_model_len.
#
#   python -m turboreflect calibrate --config turboreflect/configs/qwen3-14b.yaml
#   python -m turboreflect run --config turboreflect/configs/qwen3-14b.yaml \
#       --out-dir runs/qwen3-14b
#
# For P/D, add the `pd` block of turboreflect/examples/pd.yaml.

model: Qwen/Qwen3-14B
tasks: tasks/my_tasks             # a directory of task files
program: three_stage              # two_stage, three_stage or multi_round

context_reuse: true
adaptive_draft_length: true
kv_cache_dtype: fp8               # fp8 or bf16

gen_tokens: 768                   # tokens each stage generates
max_model_len: 147456
rope_scaling_factor: 4.5
rope_original_max_positions: 32768
rope_theta: 1000000

temperature: 0.6                  # the model's recommended sampling
top_p: 0.95
top_k: 20
seed_per_program: true

suffix_num_speculative_tokens: 16
suffix_max_tree_depth: 32

feedback: goal
refinement: goal
layout: requote

attention_backend: FLASH_ATTN
trust_remote_code: true
gpu_memory_utilization: 0.9
max_num_batched_tokens: 16384

# To stop each stage at the model's end of sequence:
#   decode_paths: [quality]
#   max_tokens_quality: 2048

# RULER and LongBench-v2 tasks have their own stage assembly, which
# builds one layout:
#   layout: continue
